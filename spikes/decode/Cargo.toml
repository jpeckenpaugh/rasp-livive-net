[package]
name = "rasp-decode-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the root workspace (root excludes spikes/*).
[workspace]

[lib]
name = "rasp_decode_spike"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "decode"
path = "src/main.rs"

[features]
default = ["backend-opus-pure"]
backend-opus-pure = ["dep:opus-pure"]
backend-ruopus = ["dep:ruopus"]
backend-adapter-opus-rs = ["dep:symphonia-adapter-opus-rs"]
backend-oporus = ["dep:oporus", "dep:symphonia-adapter-oporus"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["mkv"] }
symphonia-adapter-opus-rs = { version = "0.1.1", optional = true }
symphonia-adapter-oporus = { version = "0.1.3", optional = true }
opus-pure = { version = "0.2.2", optional = true }
ruopus = { version = "0.1.2", optional = true, default-features = false, features = ["std", "spectrograms"] }
oporus = { version = "0.2.4", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
