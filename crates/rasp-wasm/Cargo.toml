[package]
name = "rasp-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `cdylib` is the wasm-bindgen artifact; `rlib` keeps the crate usable from
# native tests and from future in-workspace consumers (W-01).
crate-type = ["cdylib", "rlib"]

[dependencies]
rasp-opus = { path = "../rasp-opus" }
# Must match the installed `wasm-bindgen` CLI exactly (docs/setup.md §2).
wasm-bindgen = "=0.2.129"
# `js_sys::Error` is the only JS API used: the typed error surface. 0.3.106 is
# the release that pins `wasm-bindgen = "=0.2.129"`.
js-sys = "0.3.106"
